<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --c-bg: var(--figma-color-bg, #ffffff);
      --c-bg2: #f0f0f0;
      --c-text: #232324;
      --c-text2: #5e5e5e;
      --c-text3: #b9b9b9;
      --c-border: #dbdde1;
      --c-white: #ffffff;
      --c-start: #6177f4;
      --c-end: #6ab39a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--c-text);
      padding: 14px 16px 32px;
      background: var(--c-bg);
      line-height: 1;
    }
    body.minimized { padding-bottom: 14px; }

    /* ---- Minimize button ---- */
    .minimize-btn {
      position: fixed;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--c-text2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 1000;
    }
    .minimize-btn:hover {
      background: var(--c-bg2);
      color: var(--c-text);
    }
    .minimize-btn svg { width: 16px; height: 16px; }

    /* Minimized: hide non-Frame sections and hint; keep Create button visible */
    body.minimized #createMode > .section:not(:first-child),
    body.minimized #editMode > .section:not(:first-child),
    body.minimized #hint { display: none !important; }
    body.minimized #createMode { gap: 16px !important; }

    /* ---- Section ---- */
    .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section > *:not(.section-title) {
      margin-left: 8px;
      margin-right: 8px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
    }
    /* ---- Section Inner (nested) ---- */
    .section-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ---- Frame ---- */
    .frame-container {
      background: var(--c-bg2);
      border-radius: 4px;
      padding: 9px 3px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .swap-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--c-text2);
    }
    .swap-btn:hover:not(:disabled) { color: var(--c-text); }
    .swap-btn:disabled {
      cursor: not-allowed;
      opacity: 0.35;
      color: var(--c-text3);
    }
    .swap-btn svg { width: 16px; height: 16px; }
    .frame-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 8px;
      min-width: 0;
      min-height: 80px;
    }
    .frame-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .frame-item {
      flex: 1;
      min-width: 0;
      background: var(--c-white);
      border-radius: 4px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .frame-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .frame-item .name {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-state {
      flex: 1;
      background: none;
      border-radius: 4px;
      padding: 0 12px;
      color: var(--c-text3);
      font-size: 11px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- Inline Point Picker ---- */
    .pp-inline {
      position: relative;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .pp-inline .pp-rect {
      position: absolute;
      top: 3.5px;
      left: 3.5px;
      width: 29px;
      height: 29px;
      border: 1.5px solid var(--c-border);
      border-radius: 2px;
      background: var(--c-white);
    }
    .pp-inline .pp-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c-white);
      border: 1.5px solid var(--c-border);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.1s;
      z-index: 2;
    }
    .pp-inline .pp-dot:hover {
      transform: translate(-50%, -50%) scale(1.2);
      border-color: var(--c-text2);
    }
    .pp-inline .pp-dot.active {
      transform: translate(-50%, -50%) scale(1.1);
    }

    /* ---- Color ---- */
    .color-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .color-input-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--c-bg2);
      border-radius: 4px;
      padding: 4px 8px;
      width: 96px;
      cursor: pointer;
    }
    .color-input-box .swatch-preview {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    .color-input-box input[type="color"] {
      position: absolute;
      width: 0; height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .color-input-box .hash {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-text2);
    }
    .color-input-box .hex-val {
      font-size: 11px;
      color: var(--c-text);
    }
    .style-dropdown-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--c-border);
      border-radius: 4px;
      padding: 6px 12px 8px 16px;
      width: 160px;
      background: var(--c-white);
      cursor: pointer;
      position: relative;
      font-family: inherit;
    }
    .style-dropdown-btn span {
      font-size: 11px;
      color: var(--c-text3);
      flex: 1;
    }
    .style-dropdown-btn .chevron {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }
    .style-dropdown-btn:hover { border-color: var(--c-text2); }

    /* Dropdown panel */
    .dropdown-panel {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      width: 160px;
      background: var(--c-white);
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 4px 2px rgba(0,0,0,0.15);
      z-index: 100;
      max-height: 240px;
      overflow: hidden;
    }
    .dropdown-panel.open { display: block; }
    .dd-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 4px 8px 6px;
    }
    .dd-tab {
      padding: 3px 15px;
      font-size: 12px;
      font-weight: 400;
      color: var(--c-text2);
      border: none;
      background: var(--c-white);
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
    }
    .dd-tab.active {
      color: var(--c-text);
      background: var(--c-bg2);
    }
    .dd-list {
      overflow-y: auto;
      max-height: 200px;
      border-top: 1px solid var(--c-border);
    }
    .dd-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .dd-item:hover { background: var(--c-bg2); }
    .dd-item .dd-swatch {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    .dd-item .dd-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .dd-item .dd-name { font-size: 12px; color: var(--c-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd-item .dd-hex { font-size: 10px; color: #777; }

    .swatch-section-label {
      font-size: 11px;
      color: var(--c-text2);
    }
    .swatch-grid-container {
      background: var(--c-bg2);
      border-radius: 4px;
      padding: 6px 8px 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 49px;
      overflow-y: auto;
    }
    .swatch-item {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(119,119,121,0.6);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .swatch-item:hover { transform: scale(1.2); z-index: 1; }
    .swatch-item.active { border-color: var(--c-text); box-shadow: 0 0 0 1px var(--c-white); }
    .no-swatches { font-size: 11px; color: var(--c-text3); padding: 4px; }

    /* ---- Stroke ---- */
    .stroke-top {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .weight-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 3px 0;
    }
    .weight-row label {
      font-size: 11px;
      color: var(--c-text2);
    }
    .weight-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--c-bg2);
      border-radius: 4px;
      padding: 4px 8px;
      width: 64px;
    }
    .weight-box .w-prefix {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-text2);
    }
    .weight-box input {
      width: 32px;
      border: none;
      background: none;
      font-size: 11px;
      font-family: inherit;
      color: var(--c-text);
      outline: none;
    }
    .weight-box input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* Small toggle 24x12 */
    .toggle-field {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toggle-field .tf-label {
      font-size: 11px;
      color: var(--c-text2);
    }
    .toggle-field .tf-colon {
      font-size: 11px;
      color: var(--c-text2);
    }
    .toggle-mini {
      position: relative;
      width: 24px;
      height: 12px;
      flex-shrink: 0;
    }
    .toggle-mini input {
      opacity: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 1;
    }
    .toggle-mini .tslider {
      position: absolute;
      inset: 0;
      background: var(--c-border);
      border-radius: 9999px;
      transition: 0.2s;
    }
    .toggle-mini .tslider::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      left: 1px;
      top: 1px;
      background: var(--c-white);
      border-radius: 50%;
      transition: 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .toggle-mini input:checked + .tslider { background: var(--c-text); }
    .toggle-mini input:checked + .tslider::before { transform: translateX(12px); }

    /* Arrow dir segmented */
    .arrow-dir-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .arrow-dir-select {
      flex: 1;
      border: 1px solid var(--c-border);
      border-radius: 4px;
      background: var(--c-white);
      color: var(--c-text);
      font-size: 11px;
      font-family: inherit;
      padding: 4px 8px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235e5e5e' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 24px;
    }
    .arrow-dir-select:focus {
      outline: none;
      border-color: var(--c-text2);
    }

    .line-type-group {
      display: flex;
      gap: 0;
      background: var(--c-bg2);
      border-radius: 3px;
      padding: 2px;
    }
    .line-type-btn {
      width: 22px;
      height: 16px;
      border: none;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      padding: 0;
    }
    .line-type-btn:hover { background: rgba(255,255,255,0.5); }
    .line-type-btn.active {
      background: var(--c-white);
      box-shadow: 0 1px 2px rgba(12,12,13,0.08);
    }
    .line-type-btn svg {
      width: 16px;
      height: 10px;
      stroke: var(--c-text3);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line-type-btn.active svg {
      stroke: var(--c-text);
    }

    .divider {
      height: 1px;
      background: var(--c-border);
      margin: 0;
    }

    /* Break Point */
    .bend-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bend-top {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .bend-top label {
      font-size: 11px;
      color: var(--c-text2);
    }
    .bend-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--c-bg2);
      border-radius: 4px;
      padding: 4px 8px;
      width: 64px;
    }
    .bend-box input {
      width: 22px;
      border: none;
      background: none;
      font-size: 11px;
      font-family: inherit;
      color: var(--c-text);
      outline: none;
    }
    .bend-box input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .bend-box .unit {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-text2);
    }

    /* Custom slider matching Figma design */
    .custom-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 9999px;
      background: var(--c-bg2);
      outline: none;
      position: relative;
    }
    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--c-text);
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    /* ---- Label ---- */
    .label-input {
      width: 100%;
      border: 1px solid var(--c-border);
      border-radius: 4px;
      padding: 4px 16px;
      font-size: 11px;
      font-family: inherit;
      background: var(--c-white);
      color: var(--c-text);
      outline: none;
    }
    .label-input:focus { border-color: var(--c-text2); }
    .label-input::placeholder { color: var(--c-text3); }

    .label-style-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .text-toggle-group {
      display: flex;
      gap: 0;
      background: var(--c-bg2);
      border-radius: 3px;
      padding: 2px;
    }
    .text-toggle-btn {
      border: none;
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      padding: 3px 10px;
      font-size: 11px;
      font-family: inherit;
      color: var(--c-text3);
      transition: all 0.12s;
    }
    .text-toggle-btn:hover { background: rgba(255,255,255,0.5); }
    .text-toggle-btn.active {
      background: var(--c-white);
      color: var(--c-text);
      box-shadow: 0 1px 2px rgba(12,12,13,0.08);
    }

    /* ---- Buttons ---- */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 400;
      font-family: 'Inter', inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--c-text);
      color: #f0f0f0;
    }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled {
      background: var(--c-bg2);
      color: var(--c-text3);
      cursor: not-allowed;
    }
    .btn-outline {
      background: var(--c-bg2);
      color: var(--c-text);
      border: 1px solid #dedede;
    }
    .btn-outline:hover { background: #e6e6e6; }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-row .btn { flex: 1; }
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hint {
      font-size: 11px;
      color: var(--c-text3);
      text-align: center;
      margin-top: -16px;
    }
  </style>
</head>
<body>
  <button id="minimizeBtn" class="minimize-btn" title="Minimize" aria-label="Minimize">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5-5 5 5"/></svg>
  </button>

  <!-- Create Mode -->
  <div id="createMode" style="display:flex;flex-direction:column;gap:20px">
    <div class="section">
      <div class="section-title">Frame</div>
      <div class="frame-container">
        <div class="frame-rows" id="frameList">
          <div class="empty-state">Select 2 frames</div>
        </div>
      </div>
      <div class="arrow-dir-row">
        <select class="arrow-dir-select" id="arrowDirStart">
          <option value="none" selected>━  None</option>
          <option value="arrow">▶  Arrow</option>
          <option value="triangle">◀  Triangle</option>
          <option value="line">›  Line Arrow</option>
          <option value="circle">●  Circle</option>
          <option value="diamond">◆  Diamond</option>
        </select>
        <button class="swap-btn" id="swapBtn" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4 L14 4 M14 4 L11 1 M14 4 L11 7"/>
            <path d="M14 12 L2 12 M2 12 L5 9 M2 12 L5 15"/>
          </svg>
        </button>
        <select class="arrow-dir-select" id="arrowDirEnd">
          <option value="none">━  None</option>
          <option value="arrow" selected>▶  Arrow</option>
          <option value="triangle">◀  Triangle</option>
          <option value="line">›  Line Arrow</option>
          <option value="circle">●  Circle</option>
          <option value="diamond">◆  Diamond</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Color</div>
      <div class="color-row">
        <div class="color-input-box" id="colorBox">
          <div class="swatch-preview" id="colorSwatch" style="background:#333333"></div>
          <input type="color" id="colorPicker" value="#333333" />
          <span class="hash">#</span>
          <span class="hex-val" id="colorHex">333333</span>
        </div>
        <div class="style-dropdown-btn" id="styleSelect">
          <span>Select Style/variable</span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5l3 3 3-3"/></svg>
          <div class="dropdown-panel" id="dropdownPanel">
            <div class="dd-tabs" id="ddTabs">
              <button class="dd-tab active" data-tab="styles">Style</button>
              <button class="dd-tab" data-tab="variables">Variable</button>
            </div>
            <div class="dd-list" id="ddList"></div>
          </div>
        </div>
      </div>
      <div class="section-inner">
        <div class="swatch-section-label">On this page</div>
        <div class="swatch-grid-container" id="swatchGrid"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Stroke</div>
      <div class="stroke-top">
        <div class="weight-row">
          <label>Weight</label>
          <div class="weight-box">
            <span class="w-prefix">W</span>
            <input type="text" id="strokeWeight" inputmode="decimal" value="2" />
          </div>
        </div>
        <div class="line-type-group" id="lineType">
          <button class="line-type-btn" data-value="straight" title="Straight">
            <svg viewBox="0 0 28 14"><line x1="2" y1="7" x2="26" y2="7"/></svg>
          </button>
          <button class="line-type-btn active" data-value="elbow-l" title="L-bend">
            <svg viewBox="0 0 28 14"><polyline points="2,12 18,12 18,2"/></svg>
          </button>
          <button class="line-type-btn" data-value="elbow-z" title="2-bend">
            <svg viewBox="0 0 28 14"><polyline points="2,12 14,12 14,2 26,2"/></svg>
          </button>
          <button class="line-type-btn" data-value="curve" title="Curve">
            <svg viewBox="0 0 28 14"><path d="M2,12 C10,12 18,2 26,2"/></svg>
          </button>
        </div>
        <div class="toggle-field">
          <span class="tf-label">Dashed</span><span class="tf-colon">:</span>
          <div class="toggle-mini">
            <input type="checkbox" id="dashed" />
            <span class="tslider"></span>
          </div>
        </div>
      </div>
      <div class="bend-section" id="bendRow">
        <div class="bend-top">
          <label>Break Point</label>
          <div class="bend-box">
            <input type="number" id="bendPositionInput" min="5" max="95" value="50" />
            <span class="unit">%</span>
          </div>
        </div>
        <input type="range" class="custom-slider" id="bendPosition" min="5" max="95" value="50" />
      </div>
    </div>

    <div class="section">
      <div class="section-title">Label</div>
      <div class="label-style-row">
        <div class="weight-row">
          <label>Size</label>
          <div class="weight-box">
            <span class="w-prefix">Aa</span>
            <input type="text" id="labelFontSize" inputmode="decimal" value="14" />
          </div>
        </div>
        <div class="text-toggle-group" id="labelWeight">
          <button class="text-toggle-btn active" data-value="regular">Regular</button>
          <button class="text-toggle-btn" data-value="bold">Bold</button>
        </div>
      </div>
      <input type="text" class="label-input" id="labelInput" placeholder="Input Text" />
    </div>

    <div class="btn-stack">
      <button class="btn btn-primary" id="connectBtn" disabled>Create Arrow</button>
      <button class="btn btn-outline" id="relaunchBtn">Relaunch</button>
    </div>
    <div class="hint" id="hint">Select 2 frames to connect</div>
  </div>

  <!-- Edit Mode -->
  <div id="editMode" style="display:none;flex-direction:column;gap:20px;">
    <div class="section">
      <div class="section-title">Frame</div>
      <div class="frame-container">
        <div class="frame-rows" id="editFrameList"></div>
      </div>
      <div class="arrow-dir-row">
        <select class="arrow-dir-select" id="editArrowDirStart">
          <option value="none" selected>━  None</option>
          <option value="arrow">▶  Arrow</option>
          <option value="triangle">◀  Triangle</option>
          <option value="line">›  Line Arrow</option>
          <option value="circle">●  Circle</option>
          <option value="diamond">◆  Diamond</option>
        </select>
        <button class="swap-btn" id="editSwapBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4 L14 4 M14 4 L11 1 M14 4 L11 7"/>
            <path d="M14 12 L2 12 M2 12 L5 9 M2 12 L5 15"/>
          </svg>
        </button>
        <select class="arrow-dir-select" id="editArrowDirEnd">
          <option value="none">━  None</option>
          <option value="arrow" selected>▶  Arrow</option>
          <option value="triangle">◀  Triangle</option>
          <option value="line">›  Line Arrow</option>
          <option value="circle">●  Circle</option>
          <option value="diamond">◆  Diamond</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Color</div>
      <div class="color-row">
        <div class="color-input-box" id="editColorBox">
          <div class="swatch-preview" id="editColorSwatch" style="background:#333333"></div>
          <input type="color" id="editColorPicker" value="#333333" />
          <span class="hash">#</span>
          <span class="hex-val" id="editColorHex">333333</span>
        </div>
        <div class="style-dropdown-btn" id="editStyleSelect">
          <span>Select Style/variable</span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5l3 3 3-3"/></svg>
          <div class="dropdown-panel" id="editDropdownPanel">
            <div class="dd-tabs" id="editDdTabs">
              <button class="dd-tab active" data-tab="styles">Style</button>
              <button class="dd-tab" data-tab="variables">Variable</button>
            </div>
            <div class="dd-list" id="editDdList"></div>
          </div>
        </div>
      </div>
      <div class="section-inner">
        <div class="swatch-section-label">On this page</div>
        <div class="swatch-grid-container" id="editSwatchGrid"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Stroke</div>
      <div class="stroke-top">
        <div class="weight-row">
          <label>Weight</label>
          <div class="weight-box">
            <span class="w-prefix">W</span>
            <input type="text" id="editStrokeWeight" inputmode="decimal" value="2" />
          </div>
        </div>
        <div class="line-type-group" id="editLineType">
          <button class="line-type-btn" data-value="straight" title="Straight">
            <svg viewBox="0 0 28 14"><line x1="2" y1="7" x2="26" y2="7"/></svg>
          </button>
          <button class="line-type-btn active" data-value="elbow-l" title="L-bend">
            <svg viewBox="0 0 28 14"><polyline points="2,12 18,12 18,2"/></svg>
          </button>
          <button class="line-type-btn" data-value="elbow-z" title="2-bend">
            <svg viewBox="0 0 28 14"><polyline points="2,12 14,12 14,2 26,2"/></svg>
          </button>
          <button class="line-type-btn" data-value="curve" title="Curve">
            <svg viewBox="0 0 28 14"><path d="M2,12 C10,12 18,2 26,2"/></svg>
          </button>
        </div>
        <div class="toggle-field">
          <span class="tf-label">Dashed</span><span class="tf-colon">:</span>
          <div class="toggle-mini">
            <input type="checkbox" id="editDashed" />
            <span class="tslider"></span>
          </div>
        </div>
      </div>
      <div class="bend-section" id="editBendRow">
        <div class="bend-top">
          <label>Break Point</label>
          <div class="bend-box">
            <input type="number" id="editBendPositionInput" min="5" max="95" value="50" />
            <span class="unit">%</span>
          </div>
        </div>
        <input type="range" class="custom-slider" id="editBendPosition" min="5" max="95" value="50" />
      </div>
    </div>

    <div class="section">
      <div class="section-title">Label</div>
      <div class="label-style-row">
        <div class="weight-row">
          <label>Size</label>
          <div class="weight-box">
            <span class="w-prefix">Aa</span>
            <input type="text" id="editLabelFontSize" inputmode="decimal" value="14" />
          </div>
        </div>
        <div class="text-toggle-group" id="editLabelWeight">
          <button class="text-toggle-btn active" data-value="regular">Regular</button>
          <button class="text-toggle-btn" data-value="bold">Bold</button>
        </div>
      </div>
      <input type="text" class="label-input" id="editLabelInput" placeholder="Input Text" />
    </div>

  </div>

  <script>
    // ---- Inline Point Picker 36x36 ----
    const PP_POS = {
      'top':    { left: 18, top: 3.5 },
      'left':   { left: 3.5, top: 18 },
      'right':  { left: 32.5, top: 18 },
      'bottom': { left: 18, top: 32.5 },
    };

    function createInlinePicker(container, accentColor) {
      const wrap = document.createElement('div');
      wrap.className = 'pp-inline';
      const rect = document.createElement('div');
      rect.className = 'pp-rect';
      wrap.appendChild(rect);
      let selected = 'auto';
      let cb = null;
      const dots = {};
      for (const [pos, c] of Object.entries(PP_POS)) {
        const d = document.createElement('div');
        d.className = 'pp-dot';
        d.style.left = c.left + 'px';
        d.style.top = c.top + 'px';
        d.title = pos;
        d.addEventListener('click', (e) => {
          e.stopPropagation();
          selected = selected === pos ? 'auto' : pos;
          upd();
          if (cb) cb();
        });
        wrap.appendChild(d);
        dots[pos] = d;
      }
      function upd() {
        for (const dd of Object.values(dots)) {
          dd.classList.remove('active');
          dd.style.background = '';
          dd.style.borderColor = '';
        }
        if (selected !== 'auto' && dots[selected]) {
          dots[selected].classList.add('active');
          dots[selected].style.background = accentColor;
          dots[selected].style.borderColor = accentColor;
        }
      }
      upd();
      container.appendChild(wrap);
      return {
        getValue() { return selected; },
        setValue(v) { selected = v || 'auto'; upd(); },
        onChange(fn) { cb = fn; },
      };
    }

    // ---- Minimize ----
    const MINIMIZE_KEY = 'arrow-connector-minimized';
    const EXPANDED_SIZE = { w: 340, h: 586 };
    const MINIMIZED_SIZE = { w: 340, h: 270 };
    const ICON_MINIMIZE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l5-5 5 5"/></svg>';
    const ICON_EXPAND   = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg>';
    const minimizeBtn = document.getElementById('minimizeBtn');

    function applyMinimized(min) {
      document.body.classList.toggle('minimized', min);
      const size = min ? MINIMIZED_SIZE : EXPANDED_SIZE;
      parent.postMessage({ pluginMessage: { type: 'resize', width: size.w, height: size.h } }, '*');
      minimizeBtn.innerHTML = min ? ICON_EXPAND : ICON_MINIMIZE;
      minimizeBtn.title = min ? 'Expand' : 'Minimize';
      minimizeBtn.setAttribute('aria-label', min ? 'Expand' : 'Minimize');
      try { localStorage.setItem(MINIMIZE_KEY, min ? '1' : '0'); } catch {}
    }
    minimizeBtn.addEventListener('click', () => {
      applyMinimized(!document.body.classList.contains('minimized'));
    });
    try {
      if (localStorage.getItem(MINIMIZE_KEY) === '1') applyMinimized(true);
    } catch {}

    // ---- State ----
    let frames = [];
    let currentArrowId = null;
    let startPicker = null, endPicker = null;
    let editStartPicker = null, editEndPicker = null;
    let editDebounceTimer = null;
    let labelDebounceTimer = null;

    function cancelPendingEditUpdates() {
      clearTimeout(editDebounceTimer);
      clearTimeout(labelDebounceTimer);
      editDebounceTimer = null;
      labelDebounceTimer = null;
    }

    function appendFrameItemContent(container, name, color) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = color;
      const nameEl = document.createElement('span');
      nameEl.className = 'name';
      nameEl.textContent = String(name ?? '');
      container.append(dot, nameEl);
    }

    const createMode = document.getElementById('createMode');
    const editMode = document.getElementById('editMode');
    const frameList = document.getElementById('frameList');
    const connectBtn = document.getElementById('connectBtn');
    const hint = document.getElementById('hint');
    const strokeWeight = document.getElementById('strokeWeight');
    const editStrokeWeight = document.getElementById('editStrokeWeight');
    const editFrameList = document.getElementById('editFrameList');

    // Bend
    const bendPosition = document.getElementById('bendPosition');
    const bendInput = document.getElementById('bendPositionInput');
    const bendRow = document.getElementById('bendRow');
    const editBendPosition = document.getElementById('editBendPosition');
    const editBendInput = document.getElementById('editBendPositionInput');
    const editBendRow = document.getElementById('editBendRow');

    bendPosition.addEventListener('input', () => { bendInput.value = bendPosition.value; updateSliderBg(bendPosition); });
    bendInput.addEventListener('change', () => { bendPosition.value = bendInput.value; updateSliderBg(bendPosition); });
    editBendPosition.addEventListener('input', () => { editBendInput.value = editBendPosition.value; updateSliderBg(editBendPosition); });
    editBendInput.addEventListener('change', () => { editBendPosition.value = editBendInput.value; updateSliderBg(editBendPosition); });

    function bendKeydown(e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        let v = parseInt(e.target.value) || 50;
        v = e.key === 'ArrowUp' ? v + step : v - step;
        v = Math.max(5, Math.min(95, v));
        e.target.value = v;
        // スライダーも同期
        const slider = e.target === bendInput ? bendPosition : editBendPosition;
        slider.value = v;
        updateSliderBg(slider);
        e.target.dispatchEvent(new Event('input'));
      }
    }
    bendInput.addEventListener('keydown', bendKeydown);
    editBendInput.addEventListener('keydown', bendKeydown);

    function updateSliderBg(slider) {
      const pct = (slider.value - slider.min) / (slider.max - slider.min) * 100;
      slider.style.background = `linear-gradient(to right, #232324 0%, #232324 ${pct}%, #f0f0f0 ${pct}%, #f0f0f0 100%)`;
    }
    updateSliderBg(bendPosition);
    updateSliderBg(editBendPosition);

    function initLineType(id, bendRowEl) {
      const container = document.getElementById(id);
      const btns = container.querySelectorAll('.line-type-btn');
      function getValue() { const a = container.querySelector('.line-type-btn.active'); return a ? a.dataset.value : 'elbow-l'; }
      function setValue(v) {
        // 旧boolean互換: true→curve, false→elbow-l
        if (v === true) v = 'curve';
        else if (v === false) v = 'elbow-l';
        // 旧 'elbow' → 'elbow-l' に正規化
        else if (v === 'elbow') v = 'elbow-l';
        btns.forEach(b => b.classList.toggle('active', b.dataset.value === v));
        updateBendVis();
      }
      // bendスライダーは「2折り（elbow-z）」のときだけ表示
      function updateBendVis() { bendRowEl.style.display = getValue() === 'elbow-z' ? '' : 'none'; }
      btns.forEach(b => b.addEventListener('click', () => { setValue(b.dataset.value); }));
      updateBendVis();
      return { getValue, setValue, updateBendVis };
    }
    const lineTypeCreate = initLineType('lineType', bendRow);
    const lineTypeEdit = initLineType('editLineType', editBendRow);

    // Label太さ（Regular/Bold）の2択トグル
    function initTextToggle(id) {
      const container = document.getElementById(id);
      const btns = container.querySelectorAll('.text-toggle-btn');
      function getValue() { const a = container.querySelector('.text-toggle-btn.active'); return a ? a.dataset.value : 'regular'; }
      function setValue(v) { btns.forEach(b => b.classList.toggle('active', b.dataset.value === v)); }
      btns.forEach(b => b.addEventListener('click', () => setValue(b.dataset.value)));
      return { getValue, setValue };
    }
    const labelWeightCreate = initTextToggle('labelWeight');
    const labelWeightEdit = initTextToggle('editLabelWeight');

    // ---- Color ----
    const colorPicker = document.getElementById('colorPicker');
    const colorHex = document.getElementById('colorHex');
    const colorSwatch = document.getElementById('colorSwatch');
    const editColorPicker = document.getElementById('editColorPicker');
    const editColorHex = document.getElementById('editColorHex');
    const editColorSwatch = document.getElementById('editColorSwatch');

    function syncColor(picker, hex, swatch) {
      hex.textContent = picker.value.replace('#','');
      swatch.style.background = picker.value;
    }
    colorPicker.addEventListener('input', () => syncColor(colorPicker, colorHex, colorSwatch));
    editColorPicker.addEventListener('input', () => syncColor(editColorPicker, editColorHex, editColorSwatch));
    document.getElementById('colorBox').addEventListener('click', () => colorPicker.click());
    document.getElementById('editColorBox').addEventListener('click', () => editColorPicker.click());

    // ---- Style dropdown ----
    let allSwatches = [];

    function setupDD(selId, panelId, tabsId, listId, pickerId, hexId, swatchId, isEdit) {
      const sel = document.getElementById(selId);
      const panel = document.getElementById(panelId);
      const tabs = document.getElementById(tabsId);
      const list = document.getElementById(listId);
      let tab = 'styles';

      sel.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.dropdown-panel').forEach(d => { if (d !== panel) d.classList.remove('open'); });
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) render();
      });
      tabs.addEventListener('click', (e) => {
        const t = e.target.closest('.dd-tab');
        if (!t) return;
        e.stopPropagation();
        tab = t.dataset.tab;
        tabs.querySelectorAll('.dd-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        render();
      });
      function render() {
        list.innerHTML = '';
        const items = allSwatches.filter(s => s.group === tab);
        if (!items.length) { list.innerHTML = '<div style="padding:12px;text-align:center;color:#b9b9b9;font-size:11px">No items</div>'; return; }
        for (const it of items) {
          const el = document.createElement('div');
          el.className = 'dd-item';
          const swatch = document.createElement('div');
          swatch.className = 'dd-swatch';
          swatch.style.background = it.hex;
          const info = document.createElement('div');
          info.className = 'dd-info';
          const name = document.createElement('div');
          name.className = 'dd-name';
          name.textContent = String(it.name ?? '');
          const hex = document.createElement('div');
          hex.className = 'dd-hex';
          hex.textContent = String(it.hex ?? '');
          info.append(name, hex);
          el.append(swatch, info);
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById(pickerId).value = it.hex;
            document.getElementById(hexId).textContent = it.hex.replace('#','');
            document.getElementById(swatchId).style.background = it.hex;
            panel.classList.remove('open');
            if (isEdit) sendEditUpdate();
            else if (typeof savePrefs === 'function') savePrefs();
          });
          list.appendChild(el);
        }
      }
    }
    setupDD('styleSelect','dropdownPanel','ddTabs','ddList','colorPicker','colorHex','colorSwatch', false);
    setupDD('editStyleSelect','editDropdownPanel','editDdTabs','editDdList','editColorPicker','editColorHex','editColorSwatch', true);
    document.addEventListener('click', () => { document.querySelectorAll('.dropdown-panel').forEach(d => d.classList.remove('open')); });

    let allPageSwatches = [];
    function renderSwatchGrids() {
      ['swatchGrid','editSwatchGrid'].forEach((gid, idx) => {
        const grid = document.getElementById(gid);
        const pid = idx === 0 ? 'colorPicker' : 'editColorPicker';
        const hid = idx === 0 ? 'colorHex' : 'editColorHex';
        const sid = idx === 0 ? 'colorSwatch' : 'editColorSwatch';
        grid.innerHTML = '';
        const items = allPageSwatches.length ? allPageSwatches : allSwatches;
        if (!items.length) { grid.innerHTML = '<span class="no-swatches">No colors on this page</span>'; return; }
        for (const it of items) {
          const sw = document.createElement('div');
          sw.className = 'swatch-item';
          sw.style.background = it.hex;
          sw.title = it.name || it.hex;
          sw.addEventListener('click', () => {
            document.getElementById(pid).value = it.hex;
            document.getElementById(hid).textContent = it.hex.replace('#','');
            document.getElementById(sid).style.background = it.hex;
            if (idx === 1) sendEditUpdate();
            else if (typeof savePrefs === 'function') savePrefs();
          });
          grid.appendChild(sw);
        }
      });
    }

    // ---- Arrow dir ----
    function initArrowDir(startId, endId) {
      const startSel = document.getElementById(startId);
      const endSel = document.getElementById(endId);
      return {
        getValue() { return { start: startSel.value, end: endSel.value }; },
        setValue(v) {
          if (typeof v === 'object') { startSel.value = v.start || 'none'; endSel.value = v.end || 'none'; }
          else if (v === 'both') { startSel.value = 'arrow'; endSel.value = 'arrow'; }
          else if (v === 'start') { startSel.value = 'arrow'; endSel.value = 'none'; }
          else if (v === 'end') { startSel.value = 'none'; endSel.value = 'arrow'; }
          else { startSel.value = 'none'; endSel.value = 'none'; }
        },
        getArrows() { return { startArrow: startSel.value, endArrow: endSel.value }; },
      };
    }
    const arrowDirCreate = initArrowDir('arrowDirStart', 'arrowDirEnd');
    const arrowDirEdit = initArrowDir('editArrowDirStart', 'editArrowDirEnd');

    // ---- Messages ----
    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return;

      if (msg.type === 'color-swatches') {
        if (!Array.isArray(msg.swatches)) return;
        allSwatches = msg.swatches;
        allPageSwatches = Array.isArray(msg.pageSwatches) ? msg.pageSwatches : [];
        renderSwatchGrids();
      }

      if (msg.type === 'selection-update') {
        if (!Array.isArray(msg.frames)) return;
        cancelPendingEditUpdates();
        frames = msg.frames;
        currentArrowId = null;
        createMode.style.display = 'flex';
        editMode.style.display = 'none';
        updateCreateUI();
        // 自動計算された接続位置をピッカーに反映
        if (msg.autoStartSide && msg.autoStartSide !== 'auto' && startPicker) {
          startPicker.setValue(msg.autoStartSide);
        }
        if (msg.autoEndSide && msg.autoEndSide !== 'auto' && endPicker) {
          endPicker.setValue(msg.autoEndSide);
        }
      }

      if (msg.type === 'edit-arrow') {
        if (typeof msg.arrowId !== 'string' || !msg.options || typeof msg.options !== 'object') return;
        if (typeof msg.options.color !== 'string') return;
        cancelPendingEditUpdates();
        currentArrowId = msg.arrowId;
        createMode.style.display = 'none';
        editMode.style.display = 'flex';

        editFrameList.innerHTML = '';
        [{n: msg.sourceName, e: msg.sourceExists, c: '#6177f4'},
         {n: msg.targetName, e: msg.targetExists, c: '#6ab39a'}].forEach((item, i) => {
          const row = document.createElement('div');
          row.className = 'frame-row';
          const fi = document.createElement('div');
          fi.className = 'frame-item';
          appendFrameItemContent(fi, item.n, item.e ? item.c : '#ccc');
          row.appendChild(fi);
          const ph = document.createElement('span');
          row.appendChild(ph);
          editFrameList.appendChild(row);
          if (i === 0) {
            editStartPicker = createInlinePicker(ph, item.c);
            editStartPicker.onChange(sendEditUpdate);
          } else {
            editEndPicker = createInlinePicker(ph, item.c);
            editEndPicker.onChange(sendEditUpdate);
          }
        });

        const o = msg.options;
        editColorPicker.value = o.color;
        editColorHex.textContent = o.color.replace('#','');
        editColorSwatch.style.background = o.color;
        editStrokeWeight.value = o.strokeWeight;
        lineTypeEdit.setValue(o.lineType ?? (o.curved ? 'curve' : 'elbow-l'));
        document.getElementById('editDashed').checked = o.dashed;
        editStartPicker.setValue(o.startSide || 'auto');
        editEndPicker.setValue(o.endSide || 'auto');
        document.getElementById('editLabelInput').value = o.label || '';
        document.getElementById('editLabelFontSize').value = o.labelFontSize || 14;
        labelWeightEdit.setValue(o.labelBold ? 'bold' : 'regular');

        arrowDirEdit.setValue({ start: typeof o.startArrow === 'string' ? o.startArrow : (o.startArrow ? 'arrow' : 'none'), end: typeof o.endArrow === 'string' ? o.endArrow : (o.endArrow !== false ? 'arrow' : 'none') });

        const bp = Math.round((o.bendPosition ?? 0.5) * 100);
        editBendPosition.value = bp;
        editBendInput.value = bp;
        updateSliderBg(editBendPosition);
      }
    };

    function updateCreateUI() {
      frameList.innerHTML = '';
      if (frames.length === 0) {
        frameList.innerHTML = '<div class="empty-state">Select 2 frames</div>';
        connectBtn.disabled = true;
        hint.textContent = 'Select 2 frames to connect';
        document.getElementById('swapBtn').disabled = true;
        return;
      }
      const colors = ['#6177f4','#6ab39a'];
      const display = frames.slice(0, 2);

      display.forEach((f, i) => {
        const row = document.createElement('div');
        row.className = 'frame-row';
        const fi = document.createElement('div');
        fi.className = 'frame-item';
        appendFrameItemContent(fi, f.name, colors[i]);
        row.appendChild(fi);
        const ph = document.createElement('span');
        row.appendChild(ph);
        frameList.appendChild(row);
        if (i === 0) { startPicker = createInlinePicker(ph, colors[i]); }
        else { endPicker = createInlinePicker(ph, colors[i]); }
      });

      if (frames.length === 1) { connectBtn.disabled = true; hint.textContent = 'Select 1 more frame'; }
      else { connectBtn.disabled = false; hint.textContent = frames.length > 2 ? 'First 2 frames will be connected' : ''; }
      document.getElementById('swapBtn').disabled = frames.length < 2;
    }

    // ---- Prefs ----
    const STORAGE_KEY = 'arrow-connector-prefs';
    function readStrokeWeight(input, fallback = 2) {
      const value = parseFloat(input.value);
      if (!Number.isFinite(value)) return fallback;
      return Math.round(Math.max(0.5, Math.min(20, value)) * 10) / 10;
    }
    function savePrefs() {
      const p = {
        color: colorPicker.value,
        strokeWeight: readStrokeWeight(strokeWeight),
        lineType: lineTypeCreate.getValue(),
        dashed: document.getElementById('dashed').checked,
        arrowDirStart: arrowDirCreate.getValue().start,
        arrowDirEnd: arrowDirCreate.getValue().end,
        bendPosition: parseInt(bendPosition.value),
        labelFontSize: parseFloat(document.getElementById('labelFontSize').value),
        labelBold: labelWeightCreate.getValue() === 'bold',
      };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {}
    }
    function loadPrefs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.color) { colorPicker.value = p.color; colorHex.textContent = p.color.replace('#',''); colorSwatch.style.background = p.color; }
        if (p.strokeWeight) strokeWeight.value = p.strokeWeight;
        if (p.lineType) lineTypeCreate.setValue(p.lineType);
        else if (typeof p.curved === 'boolean') lineTypeCreate.setValue(p.curved ? 'curve' : 'elbow-l');
        if (typeof p.dashed === 'boolean') document.getElementById('dashed').checked = p.dashed;
        if (p.arrowDirStart || p.arrowDirEnd) arrowDirCreate.setValue({ start: p.arrowDirStart || 'none', end: p.arrowDirEnd || 'arrow' });
        else if (p.arrowDirValue) arrowDirCreate.setValue(p.arrowDirValue);
        if (p.bendPosition) { bendPosition.value = p.bendPosition; bendInput.value = p.bendPosition; updateSliderBg(bendPosition); }
        if (p.labelFontSize) document.getElementById('labelFontSize').value = p.labelFontSize;
        if (typeof p.labelBold === 'boolean') labelWeightCreate.setValue(p.labelBold ? 'bold' : 'regular');
      } catch {}
    }
    loadPrefs();

    function getCreateOpts() {
      const a = arrowDirCreate.getArrows();
      const o = {
        color: colorPicker.value, strokeWeight: readStrokeWeight(strokeWeight),
        lineType: lineTypeCreate.getValue(), curved: lineTypeCreate.getValue() === 'curve',
        dashed: document.getElementById('dashed').checked,
        startSide: startPicker ? startPicker.getValue() : 'auto',
        endSide: endPicker ? endPicker.getValue() : 'auto',
        label: document.getElementById('labelInput').value,
        labelFontSize: parseFloat(document.getElementById('labelFontSize').value) || 14,
        labelBold: labelWeightCreate.getValue() === 'bold',
        startArrow: a.startArrow, endArrow: a.endArrow,
        bendPosition: parseInt(bendPosition.value) / 100,
      };
      savePrefs();
      return o;
    }
    function getEditOpts() {
      const a = arrowDirEdit.getArrows();
      const o = {
        color: editColorPicker.value, strokeWeight: readStrokeWeight(editStrokeWeight),
        lineType: lineTypeEdit.getValue(), curved: lineTypeEdit.getValue() === 'curve',
        dashed: document.getElementById('editDashed').checked,
        startSide: editStartPicker ? editStartPicker.getValue() : 'auto',
        endSide: editEndPicker ? editEndPicker.getValue() : 'auto',
        label: document.getElementById('editLabelInput').value,
        labelFontSize: parseFloat(document.getElementById('editLabelFontSize').value) || 14,
        labelBold: labelWeightEdit.getValue() === 'bold',
        startArrow: a.startArrow, endArrow: a.endArrow,
        bendPosition: parseInt(editBendPosition.value) / 100,
      };
      // sync to create mode
      colorPicker.value = o.color; colorHex.textContent = o.color.replace('#',''); colorSwatch.style.background = o.color;
      strokeWeight.value = o.strokeWeight;
      lineTypeCreate.setValue(o.lineType || (o.curved ? 'curve' : 'elbow-l'));
      document.getElementById('dashed').checked = o.dashed;
      bendPosition.value = Math.round(o.bendPosition * 100);
      bendInput.value = Math.round(o.bendPosition * 100);
      updateSliderBg(bendPosition);
      arrowDirCreate.setValue(arrowDirEdit.getValue());
      document.getElementById('labelFontSize').value = o.labelFontSize;
      labelWeightCreate.setValue(o.labelBold ? 'bold' : 'regular');
      savePrefs();
      return o;
    }

    // ---- Swap ----
    document.getElementById('swapBtn').addEventListener('click', () => {
      if (frames.length >= 2) {
        [frames[0], frames[1]] = [frames[1], frames[0]];
        const sv = startPicker ? startPicker.getValue() : 'auto';
        const ev = endPicker ? endPicker.getValue() : 'auto';
        updateCreateUI();
        if (startPicker) startPicker.setValue(ev);
        if (endPicker) endPicker.setValue(sv);
      }
    });
    document.getElementById('editSwapBtn').addEventListener('click', () => {
      if (!currentArrowId) return;
      const sv = editStartPicker ? editStartPicker.getValue() : 'auto';
      const ev = editEndPicker ? editEndPicker.getValue() : 'auto';
      if (editStartPicker) editStartPicker.setValue(ev);
      if (editEndPicker) editEndPicker.setValue(sv);
      const o = getEditOpts();
      parent.postMessage({ pluginMessage: { type: 'swap-arrow', arrowId: currentArrowId, ...o } }, '*');
    });

    // ---- Actions ----
    connectBtn.addEventListener('click', () => {
      if (frames.length < 2) return;
      const o = getCreateOpts();
      parent.postMessage({ pluginMessage: { type: 'connect', sourceId: frames[0].id, targetId: frames[1].id, ...o } }, '*');
    });
    document.getElementById('relaunchBtn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'refresh-all' } }, '*');
    });

    // ---- Persist create-mode changes immediately ----
    colorPicker.addEventListener('input', savePrefs);
    strokeWeight.addEventListener('input', savePrefs);
    strokeWeight.addEventListener('blur', savePrefs);
    document.getElementById('dashed').addEventListener('change', savePrefs);
    document.getElementById('lineType').addEventListener('click', (e) => {
      if (e.target.closest('.line-type-btn')) setTimeout(savePrefs, 0);
    });
    document.getElementById('arrowDirStart').addEventListener('change', savePrefs);
    document.getElementById('arrowDirEnd').addEventListener('change', savePrefs);
    bendPosition.addEventListener('input', savePrefs);
    bendInput.addEventListener('change', savePrefs);
    document.getElementById('labelFontSize').addEventListener('input', savePrefs);
    document.getElementById('labelFontSize').addEventListener('blur', savePrefs);
    document.getElementById('labelWeight').addEventListener('click', (e) => {
      if (e.target.closest('.text-toggle-btn')) setTimeout(savePrefs, 0);
    });

    // Final save on window teardown (plugin close)
    window.addEventListener('beforeunload', savePrefs);
    window.addEventListener('pagehide', savePrefs);
    // ---- Edit mode: 即時反映 ----
    function sendEditUpdate() {
      if (!currentArrowId) return;
      const arrowId = currentArrowId;
      clearTimeout(editDebounceTimer);
      editDebounceTimer = setTimeout(() => {
        if (currentArrowId !== arrowId) return;
        const o = getEditOpts();
        parent.postMessage({ pluginMessage: { type: 'update-arrow', arrowId, ...o } }, '*');
      }, 80);
    }
    // Label入力は矢印全体を作り直さず、テキストだけ差し替える軽量経路を使う
    function sendLabelUpdate() {
      if (!currentArrowId) return;
      const arrowId = currentArrowId;
      clearTimeout(labelDebounceTimer);
      labelDebounceTimer = setTimeout(() => {
        if (currentArrowId !== arrowId) return;
        const label = document.getElementById('editLabelInput').value;
        parent.postMessage({ pluginMessage: { type: 'update-arrow-label', arrowId, label } }, '*');
      }, 80);
    }
    // strokeWeight バリデーション（0.5〜20、小数第1位まで）+ 上下キー対応
    function clampWeight(input) {
      input.value = readStrokeWeight(input, 0.5);
    }
    function weightKeydown(e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const step = e.shiftKey ? 1 : 0.1;
        let v = parseFloat(e.target.value) || 1;
        v = e.key === 'ArrowUp' ? v + step : v - step;
        v = Math.round(Math.max(0.5, Math.min(20, v)) * 10) / 10;
        e.target.value = v;
        e.target.dispatchEvent(new Event('input'));
      }
    }
    strokeWeight.addEventListener('blur', () => clampWeight(strokeWeight));
    strokeWeight.addEventListener('keydown', weightKeydown);
    editStrokeWeight.addEventListener('blur', () => clampWeight(editStrokeWeight));
    editStrokeWeight.addEventListener('keydown', weightKeydown);

    editColorPicker.addEventListener('input', sendEditUpdate);
    editStrokeWeight.addEventListener('input', sendEditUpdate);
    document.getElementById('editDashed').addEventListener('change', sendEditUpdate);
    document.getElementById('editLineType').addEventListener('click', (e) => {
      if (e.target.closest('.line-type-btn')) setTimeout(sendEditUpdate, 0);
    });
    editBendPosition.addEventListener('input', sendEditUpdate);
    editBendInput.addEventListener('change', sendEditUpdate);
    document.getElementById('editLabelInput').addEventListener('input', sendLabelUpdate);
    document.getElementById('editLabelFontSize').addEventListener('input', sendEditUpdate);
    document.getElementById('editLabelFontSize').addEventListener('blur', sendEditUpdate);
    document.getElementById('editLabelWeight').addEventListener('click', (e) => {
      if (e.target.closest('.text-toggle-btn')) setTimeout(sendEditUpdate, 0);
    });
    // arrow dir selects
    document.getElementById('editArrowDirStart').addEventListener('change', sendEditUpdate);
    document.getElementById('editArrowDirEnd').addEventListener('change', sendEditUpdate);
  </script>
</body>
</html>
